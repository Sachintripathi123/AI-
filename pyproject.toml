[project]
name = "ai-research-assistant-main"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sachintripathi123", email = "sachintripathi6306492549@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "google-genai>=2.25.0",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.19.0",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.64.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[project.scripts]
ai-research-assistant-main = "ai_research_assistant_main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
